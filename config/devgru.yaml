# logging stuff
## =0 turns off
#print_log_freq: 100 # in iterations
#image_log_freq: 1000 #0 # in iterations
num_images_log: 24 #16 #8 #0 
pairwise_test_freq: 0 # in epochs
eval_fraction: 0.25
wandb_log_freq: 10 # in iterations
eval_freq: 1 # in epochs

#################################################################
# This config also used in split_data.py 
#################################################################
data_split:
  split_ratio: 0.8  # (train 0.8, val 0.2)
  former:
    data_folder: /storage/data/mydata/former_ewha/mixed_2K 
    train: /storage/data/mydata/viznav/data_splits/former_ewha/mixed_2K/train
    test:  /storage/data/mydata/viznav/data_splits/former_ewha/mixed_2K/test
    waypoint_spacing: 3
    negative_mining: True
#################################################################
# The dataset used for train_action_predictor.py (coll + non-coll data)
#################################################################
datasets:
  former: 
    data_folder: /storage/data/mydata/former_ewha/mixed_2K 
    train: /storage/data/mydata/viznav/data_splits/former_ewha/mixed_2K/train
    test:  /storage/data/mydata/viznav/data_splits/former_ewha/mixed_2K/test
    end_slack: 3
    goals_per_obs: 1
    negative_mining: True
    waypoint_spacing: 3 #1      # frame_to_frame spacing  

    
  #isaac_sim: 
    #data_folder: /media/data/mydata/isaacsim_dataset/0512/data #/media/data/pubdata/viznav_dataset/former/data_splits/train
    #train: /media/data/mydata/viznav/data_splits/isaacsim/0512/train 
    #test:  /media/data/mydata/viznav/data_splits/isaacsim/0512/test  

    #end_slack: 3
    #goals_per_obs: 1
    #negative_mining: True
##################################################################
# used for deployment 
##################################################################
deployment:
    dataset_name: former
    topomap_name: T0 #T32 #T1-1 # 
    nav_model_type: devgru_ap #dev_gru
    col_model_type: devgru_cp #depth_coll  # depth_sg_coll
    use_coll_pred_model: True
    goal_type: depth
    waypoint_spacing: 3
    subgoal_spacing: 1  # sg frames to skip (1 skips none, 2 skips 1) 
    xy_dist_thr: 0.5    # meter    
    ang_dist_thr: 5     # deg
    nav_ckpth_name: devgru-last_dim_32.pth # devgru-base.pth # #devgru-two_heads-mixed_12K.pth 
    col_ckpth_name: dev_coll-depth_only-20K.pth #dev_coll-curr_sg-20K.pth #   
    nav_log_dir: /media/glab/FetchSSD/results/base_lines/devgru
    #ckpth_name: image_pose_rnn-ws3.pth

##################################################################
# used for testing 
##################################################################
test:
    test_dataset_path: /media/data/mydata/former_datasets/colldata/colldata-test
    out_res_path:  /media/results/devgru/devgru_tester/colldata-test/devgru-noncol_08K_col_10K_test-last_dim_32

