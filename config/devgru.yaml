project_name: devgru-release
run_name: devgru

# training setup
use_wandb: False # set to false if you don't want to log to wandb
train: True
batch_size: 32 #256   # 32 for colldata,  256 for navdata
epochs: 4 #100 #75
gpu_ids: [0]
num_workers: 12
lr: 5e-4
optimizer: adamw
clipping: False
#max_norm: 1.
scheduler: "cosine"
warmup: True 
#warmup_epochs: 4
#cyclic_period: 10
#plateau_patience: 3
#plateau_factor: 0.5
seed: 0

# model params
model_type: "devgru_ap" # "devgru_cp"  #"depth_coll" # #"image_pose_rnn"
obs_encoder: "efficientnet-b0" # by default, this is imagenet pretrained
obs_encoding_size: 512
odom_encoding_size: 64
#mha_num_attention_heads: 4
#mha_num_attention_layers: 4
#mha_ff_dim_factor: 4
late_fusion: False

# normalization for the action space
normalize: True

# context
context_type: temporal
context_size: 5

# weight params when computing loss
alpha: 0.9  # tradeoff between action and distance prediction loss
beta: 0.5   # tradoff between orient and waypt prediction (when learn_angle is True)
# distance bounds for distance and action and distance predictions 
distance:
  min_frame_dist: 0
  max_frame_dist: 24
action:
  min_frame_dist: 0
  max_frame_dist: 12
#close_far_threshold: 10 # distance threshold used to seperate the close and the far  subgoals that are sampled per datapoint

goal_dist_type: spatial #temporal

# action output params
len_traj_pred: 5  
learn_angle: True 

# dataset specific parameters
image_size: [85, 64] # width, height
goal_type: depth ##"rgb" # depth

use_time_weight: False #True

